name: Rust CI

on:
  workflow_call:

jobs:
  fmt:
    runs-on: >-
      ${{ github.repository == 'databricks/zerobus-sdk'
          && fromJSON('{"group":"databricks-protected-runner-group","labels":"linux-ubuntu-latest"}')
          || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up package registries
        uses: ./.github/actions/setup-registries
        with:
          registries: cargo
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - name: Verify generated FFI header is up to date
        run: |
          cargo build -p zerobus-ffi
          git diff --exit-code ffi/zerobus.h
      - name: Format all files
        run: make fmt
      - name: Fail on differences
        run: git diff --exit-code

  lint:
    runs-on: >-
      ${{ github.repository == 'databricks/zerobus-sdk'
          && fromJSON('{"group":"databricks-protected-runner-group","labels":"linux-ubuntu-latest"}')
          || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up package registries
        uses: ./.github/actions/setup-registries
        with:
          registries: cargo
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint code
        run: make lint

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
          - os: Windows
            runner: { group: databricks-protected-runner-group, labels: windows-server-latest }
    runs-on: >-
      ${{ github.repository == 'databricks/zerobus-sdk' && matrix.runner
          || (matrix.runner.labels == 'windows-server-latest' && 'windows-latest' || 'ubuntu-24.04') }}
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up package registries
        uses: ./.github/actions/setup-registries
        with:
          registries: cargo
      - name: Unshallow
        run: git fetch --prune --unshallow
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Run tests
        run: make test
